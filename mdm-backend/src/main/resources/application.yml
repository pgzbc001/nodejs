server:
  port: 8080

spring:
  application:
    name: mdm-backend
  datasource:
    url: jdbc:sqlite:data/mdm.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      continue-on-error: false
      separator: ";"

app:
  security:
    # v1.0 演示密钥（Q&A Q2 决议：v2.0 纳入密钥管理专项）
    aes-key: "MDM2026DemoKey!"

logging:
  level:
    com.mdm.platform: info
